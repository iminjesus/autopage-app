<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover so the score reaches the edges of a rounded screen;
       the safe-area insets in the stylesheet keep the controls out of the
       notch and off the home indicator. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <title>AutoPage</title>

  <!-- PWA / installable app -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" />
  <!-- iOS ignores an SVG icon for the home screen and screenshots the page
       instead, so a PNG has to be here by name. -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AutoPage" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <!-- Score surface. The PDF page is drawn here; everything else floats over it. -->
    <div class="score" id="score">
      <canvas id="scoreCanvas" class="score-canvas" hidden></canvas>
      <!-- Opening a stored score is seconds of work on a tablet. Something has
           to be happening on screen for those seconds. -->
      <div class="loading" id="loading" hidden></div>

      <div class="score-empty" id="scoreEmpty">
        <h1 class="title">AutoPage</h1>
        <p class="lede">Turn pages with a gesture. No pedal.<br />The camera stays on this device.</p>

        <div class="start-row">
          <label class="file-btn">
            Open PDF
            <input type="file" id="fileInput" accept="application/pdf,.pdf" multiple hidden />
          </label>
          <button class="file-btn file-btn-quiet" id="driveBtn">Google Drive</button>
          <button class="file-btn file-btn-quiet" id="startCalibrateBtn">Calibrate</button>
        </div>


        <!-- The last few scores, as first pages. Filled by the app. -->
        <div class="recent" id="recent" hidden></div>

        <p class="start-note" id="startCalibrateState"></p>

        <p class="start-note">
          <button class="linkish" id="sampleBtn">try a sample score</button>
        </p>

        <!-- Google's review looks for this from the home page, and anyone
             being asked to point a camera at their own face deserves to find
             it without hunting. -->
        <p class="start-note">
          <a class="linkish" href="privacy.html">privacy</a>
        </p>

        <p class="score-error" id="scoreError" hidden></p>

        <!-- iOS has no install prompt of its own — nothing appears, ever, so
             anyone who does not already know the Share menu trick uses it in a
             tab and loses it. The two steps are the whole fix. -->
        <div class="install" id="installHint" hidden>
          <p id="installText"></p>
          <div class="qr" id="qrBox" hidden></div>

          <!-- Two steps as a picture. iOS has no install prompt to hook, so
               this is the whole mechanism — and a paragraph describing a button
               is worse than an arrow pointing at it. -->
          <div class="steps" id="installSteps" hidden>
            <span class="arrow" id="installArrow">↑</span>
            <span class="glyph" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                   stroke="currentColor" stroke-width="1.7"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3v12" /><path d="M8 7l4-4 4 4" />
                <path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6" />
              </svg>
            </span>
            <span class="steps-text">then <b>Add to Home Screen</b></span>
          </div>
          <div class="start-row">
            <button class="btn btn-secondary" id="installBtn" hidden>Install</button>
            <button class="btn btn-secondary" id="shareBtn" hidden>Share link</button>
            <button class="btn btn-quiet" id="installDismiss">Not now</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Page navigation. Always available — the automatic turn never takes these away. -->
    <div class="nav" id="nav" hidden>
      <button class="nav-btn" id="prevBtn" aria-label="Previous page">‹</button>
      <button class="nav-btn" id="nextBtn" aria-label="Next page">›</button>
    </div>

    <!-- Shown only while calibrating, or when the camera cannot start. Kept at
         the top because that is where the lens is: a prompt in the corner asks
         the player to look away at the moment the gesture is being measured. -->
    <section class="watch" id="watch" hidden>
      <!-- The prompt first. Below the preview it was the thing that scrolled
           off a phone, and it is the one part that has to be readable for the
           whole six seconds the step lasts. -->
      <div class="trainer-status" id="gestureStatus" hidden></div>
      <video id="camPreview" class="cam" playsinline muted hidden></video>
      <!-- Cancel lives here during calibration, so the panel can get out of
           the way entirely instead of being half-covered by this card. -->
      <button id="cancelCalibBtn" class="btn btn-secondary btn-block" hidden>Cancel</button>
      <button id="allowBtn" class="btn btn-primary btn-block" hidden>Allow camera</button>
    </section>

    <!-- ===== Setup panel ===== -->
    <section class="panel" id="setupPanel" hidden>
      <!-- Closed over a score this is a gear and nothing else. A word floating
           on the music is one more thing between the player and the only thing
           they are looking at. -->
      <button class="panel-head" id="setupToggle" aria-expanded="true" aria-label="Setup">
        <span class="gear" aria-hidden="true">⚙️</span>
        <span class="panel-label">Setup</span>
        <span class="chevron" aria-hidden="true">▾</span>
      </button>

      <div class="panel-body">
        <p class="panel-desc" id="gestureHelp"></p>

        <!-- The reason you open this panel, most times. It is blue on the
             first screen and it is blue here: a dark rectangle on a dark panel
             does not read as a button at all, whichever one you point at. -->
        <label class="btn btn-primary btn-block file-swap">
          Open PDF
          <input type="file" id="swapFileInput" accept="application/pdf,.pdf" multiple hidden />
        </label>

        <!-- The week's songs usually live in a shared folder rather than on
             the iPad, so this is a first-class way in, not a convenience. -->
        <button class="btn btn-secondary btn-block" id="panelDriveBtn">Open from Google Drive</button>


        <!-- And again here, because a remembered score opens straight away
             and the first screen is not seen again. -->
        <div class="recent recent-panel" id="recentPanel" hidden></div>

        <!-- Only for charts that have chord symbols in them. A score with
             none never shows this. -->
        <div class="keyrow" id="keyRow" hidden>
          <span class="keyrow-label">Key</span>
          <button type="button" id="keyDown" aria-label="Down a semitone">−</button>
          <span id="keyNow">—</span>
          <button type="button" id="keyUp" aria-label="Up a semitone">+</button>
          <button type="button" id="keyReset" class="plain">original</button>
        </div>

        <!-- A set goes up a tone for the last chorus, and that happens with
             both hands busy. A thumb to the camera is the one signal a player
             can give mid-song. -->
        <label class="field field-check" id="thumbsField" hidden>
          <input type="checkbox" id="thumbsOn" />
          <span>Thumbs up changes the key <em>— twice for a tone</em></span>
        </label>
        <label class="field field-check field-sub" id="thumbsDownField" hidden>
          <input type="checkbox" id="thumbsDownOn" checked />
          <span>and thumbs down lowers it</span>
        </label>

        <button id="calibrateBtn" class="btn btn-secondary btn-block">Calibrate</button>

        <label class="field" id="holdField" hidden>
          <span id="holdLabel">Wink length (ms)</span>
          <input type="number" id="holdInput" min="100" max="1500" step="50" value="200" />
        </label>

        <!-- Two named choices, not a checkbox. "Head tilt instead of wink"
             reads as though wink were the normal state and the tilt an
             override, which is backwards — and an unticked box always looks
             like the default. -->
        <div class="field" id="modeField" hidden>
          <span>Gesture</span>
          <div class="segmented" role="radiogroup" aria-label="Gesture">
            <label>
              <input type="radio" name="gesture" id="modeTilt" value="tilt" />
              <span>Head tilt</span>
              <em>any glasses</em>
            </label>
            <label>
              <input type="radio" name="gesture" id="modeWink" value="wink" />
              <span>Wink</span>
              <em>no glasses</em>
            </label>
          </div>
        </div>

        <!-- Two words was too few: asked what it was, within a day of it being
             shortened to them. The condition it fixes is the whole point. -->
        <label class="field field-check" id="swapField" hidden>
          <input type="checkbox" id="swapInput" />
          <span>Swap sides <em>— tick if right goes backwards</em></span>
        </label>

        <div class="trainer-status warn" id="screenState" hidden></div>

        <!-- Always findable, never a nag. A returning player lands straight on
             their score, so the offer on the first screen never reaches them. -->
        <button id="panelInstallBtn" class="btn btn-secondary btn-block" hidden>Add to Home Screen</button>
        <div class="trainer-status" id="panelInstallHow" hidden></div>

        <button id="offlineBtn" class="btn btn-secondary btn-block" hidden>Save for offline (13 MB)</button>
        <div class="trainer-status" id="offlineState"></div>

        <div class="trainer-status" id="calibStatus"></div>
        <div class="diag" id="gestureAsym"></div>
        <div class="trainer-status" id="setupStatus">No score open.</div>

        <!-- A home-screen app has no address bar and so no reload button. The
             only way to pick up a new version was to force quit it, which is
             not something anyone should have to know. -->
        <a class="btn btn-secondary btn-block" href="./share.html" target="_blank" rel="noopener">Card to share</a>

        <button id="reloadBtn" class="btn btn-secondary btn-block">Check for update</button>

        <div class="diag" id="diag"></div>
      </div>
    </section>
  </main>

  <!--
    If the module fails to load — a 404 on vendor/, or a static server handing
    back the wrong MIME type for a script — no listeners are ever attached and
    the buttons silently do nothing. Say so instead.
  -->
  <script>
    window.addEventListener("error", (e) => {
      const box = document.getElementById("scoreError");
      if (box && e.target && e.target.tagName === "SCRIPT") {
        box.textContent = "Failed to load app.js — check the browser console.";
        box.hidden = false;
      }
    }, true);
    setTimeout(() => {
      if (window.__autopageReady) return;
      const box = document.getElementById("scoreError");
      if (!box) return;
      box.textContent =
        "The app did not start. Serve this folder over http:// (not file://) " +
        "and make sure vendor/pdf.js was pulled — see the console for details.";
      box.hidden = false;
    }, 2500);
  </script>
  <script type="module" src="app.js"></script>
  <!-- What Drive is doing, over everything, wherever you are.
       It had been written into the first screen, which is gone the moment a
       score is open, and then also into the Setup panel, which is closed most
       of the time. Two places that each vanish in different circumstances is
       how "I pressed Select and nothing happened" happened twice. This one is
       on top of the lot and survives both. -->
  <div class="drive-toast" id="driveToast" hidden role="status"></div>

  <!-- Permanent while the chords have been moved, because somebody reading
       the melody off the staff while the band plays the transposed chords is
       the one way this can do harm. -->
  <div class="key-band" id="keyBand" hidden role="status"></div>
</body>
</html>
