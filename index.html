<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f1115" />
  <title>AutoPage</title>

  <!-- PWA / installable app -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AutoPage" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <!-- Score surface. The PDF page is drawn here; everything else floats over it. -->
    <div class="score" id="score">
      <canvas id="scoreCanvas" class="score-canvas" hidden></canvas>

      <div class="score-empty" id="scoreEmpty">
        <h1 class="title">AutoPage</h1>
        <p class="lede">Automatic page turning for PDF sheet music.</p>
        <label class="file-btn">
          Open a score
          <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden />
        </label>
        <p class="score-error" id="scoreError" hidden></p>
      </div>
    </div>

    <!-- Status strip: page number, mode, and how close the detector is to firing -->
    <div class="hud" id="hud" hidden>
      <span class="hud-page" id="hudPage">— / —</span>
      <span class="hud-mode" id="hudMode" aria-live="polite">Manual</span>
      <span class="hud-armed" id="hudArmed" hidden aria-label="Listening for the page end">●</span>
    </div>

    <!-- Page navigation. Always available — the automatic turn never takes these away. -->
    <div class="nav" id="nav" hidden>
      <button class="nav-btn" id="prevBtn" aria-label="Previous page">‹</button>
      <button class="nav-btn" id="nextBtn" aria-label="Next page">›</button>
    </div>

    <!-- Camera and calibration, kept near the top edge: that is where the
         camera is, and reading a prompt in the far corner means looking away
         from the lens at the moment the gesture is being measured. -->
    <section class="watch" id="watch">
      <div class="watch-row">
        <span id="gestureAsym" class="watch-live">Starting the camera…</span>
        <button id="calibrateBtn" class="btn btn-secondary btn-small">Calibrate</button>
      </div>
      <video id="camPreview" class="cam" playsinline muted hidden></video>
      <div class="trainer-status" id="gestureStatus" hidden></div>
      <button id="allowBtn" class="btn btn-primary btn-block" hidden>Allow camera</button>
    </section>

    <!-- ===== Setup panel ===== -->
    <section class="panel" id="setupPanel" hidden>
      <button class="panel-head" id="setupToggle" aria-expanded="true">
        <span>⚙️ Setup</span>
        <span class="chevron">▾</span>
      </button>

      <div class="panel-body">
        <p class="panel-desc">
          Wink your right eye to turn forward, your left to go back. The camera
          runs locally and nothing leaves this device.
        </p>

        <label class="field" id="holdField" hidden>
          <span>Wink length (ms)</span>
          <input type="number" id="holdInput" min="50" max="400" step="10" value="70" />
        </label>

        <label class="field field-check" id="swapField" hidden>
          <input type="checkbox" id="swapInput" />
          <span>Swap sides — if the wrong eye turns forward</span>
        </label>

        <div class="trainer-status" id="calibStatus"></div>
        <div class="trainer-status" id="setupStatus">Open a score to begin.</div>
        <div class="diag" id="diag"></div>
      </div>
    </section>
  </main>

  <!--
    If the module fails to load — a 404 on vendor/, or a static server handing
    back the wrong MIME type for a script — no listeners are ever attached and
    the buttons silently do nothing. Say so instead.
  -->
  <script>
    window.addEventListener("error", (e) => {
      const box = document.getElementById("scoreError");
      if (box && e.target && e.target.tagName === "SCRIPT") {
        box.textContent = "Failed to load app.js — check the browser console.";
        box.hidden = false;
      }
    }, true);
    setTimeout(() => {
      if (window.__autopageReady) return;
      const box = document.getElementById("scoreError");
      if (!box) return;
      box.textContent =
        "The app did not start. Serve this folder over http:// (not file://) " +
        "and make sure vendor/pdf.js was pulled — see the console for details.";
      box.hidden = false;
    }, 2500);
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
