<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover so the score reaches the edges of a rounded screen;
       the safe-area insets in the stylesheet keep the controls out of the
       notch and off the home indicator. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <title>AutoPage</title>

  <!-- PWA / installable app -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" />
  <!-- iOS ignores an SVG icon for the home screen and screenshots the page
       instead, so a PNG has to be here by name. -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AutoPage" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <!-- Score surface. The PDF page is drawn here; everything else floats over it. -->
    <div class="score" id="score">
      <canvas id="scoreCanvas" class="score-canvas" hidden></canvas>

      <div class="score-empty" id="scoreEmpty">
        <h1 class="title">AutoPage</h1>
        <p class="lede">
          Turn the pages of a PDF score with a flick of your head, or a wink.
          No pedal, no hardware. The camera never leaves this device.
        </p>

        <!-- The sample comes first. Landing here with only a file picker means
             going to find a PDF before you can see whether any of this works,
             and most people do not come back from that trip. -->
        <div class="start-row">
          <button class="file-btn" id="sampleBtn">Try it with a sample score</button>
          <label class="file-btn file-btn-quiet">
            Open your own PDF
            <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden />
          </label>
        </div>

        <p class="score-error" id="scoreError" hidden></p>

        <!-- iOS has no install prompt of its own — nothing appears, ever, so
             anyone who does not already know the Share menu trick simply uses
             it in a tab and loses it. Saying the two steps is the whole fix. -->
        <div class="install" id="installHint" hidden>
          <p id="installText"></p>
          <div class="qr" id="qrBox" hidden></div>
          <div class="start-row">
            <button class="btn btn-secondary" id="installBtn" hidden>Install</button>
            <button class="btn btn-secondary" id="shareBtn" hidden>Share the link</button>
            <button class="btn btn-quiet" id="installDismiss">Not now</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Page navigation. Always available — the automatic turn never takes these away. -->
    <div class="nav" id="nav" hidden>
      <button class="nav-btn" id="prevBtn" aria-label="Previous page">‹</button>
      <button class="nav-btn" id="nextBtn" aria-label="Next page">›</button>
    </div>

    <!-- Shown only while calibrating, or when the camera cannot start. Kept at
         the top because that is where the lens is: a prompt in the corner asks
         the player to look away at the moment the gesture is being measured. -->
    <section class="watch" id="watch" hidden>
      <video id="camPreview" class="cam" playsinline muted hidden></video>
      <div class="trainer-status" id="gestureStatus" hidden></div>
      <button id="allowBtn" class="btn btn-primary btn-block" hidden>Allow camera</button>
    </section>

    <!-- ===== Setup panel ===== -->
    <section class="panel" id="setupPanel" hidden>
      <button class="panel-head" id="setupToggle" aria-expanded="true">
        <span>⚙️ Setup</span>
        <span class="chevron">▾</span>
      </button>

      <div class="panel-body">
        <p class="panel-desc" id="gestureHelp"></p>
        <p class="panel-desc panel-desc-quiet">
          The camera runs locally and nothing leaves this device.
        </p>

        <label class="btn btn-secondary btn-block file-swap">
          Open another score
          <input type="file" id="swapFileInput" accept="application/pdf,.pdf" hidden />
        </label>

        <button id="calibrateBtn" class="btn btn-secondary btn-block">Calibrate</button>

        <label class="field" id="holdField" hidden>
          <span id="holdLabel">Wink length (ms)</span>
          <input type="number" id="holdInput" min="100" max="1500" step="50" value="200" />
        </label>

        <label class="field field-check" id="modeField" hidden>
          <input type="checkbox" id="modeInput" />
          <span>Turn with a head tilt instead of a wink — the one that works
            behind glasses, where a lens rim sits across the eyelid.</span>
        </label>

        <label class="field field-check" id="swapField" hidden>
          <input type="checkbox" id="swapInput" />
          <span>Swap sides — if the wrong side turns forward</span>
        </label>

        <button id="offlineBtn" class="btn btn-secondary btn-block" hidden>Save for offline (13 MB)</button>
        <div class="trainer-status" id="offlineState"></div>

        <div class="trainer-status" id="calibStatus"></div>
        <div class="diag" id="gestureAsym"></div>
        <div class="trainer-status" id="setupStatus">Open a score to begin.</div>
        <div class="diag" id="diag"></div>
      </div>
    </section>
  </main>

  <!--
    If the module fails to load — a 404 on vendor/, or a static server handing
    back the wrong MIME type for a script — no listeners are ever attached and
    the buttons silently do nothing. Say so instead.
  -->
  <script>
    window.addEventListener("error", (e) => {
      const box = document.getElementById("scoreError");
      if (box && e.target && e.target.tagName === "SCRIPT") {
        box.textContent = "Failed to load app.js — check the browser console.";
        box.hidden = false;
      }
    }, true);
    setTimeout(() => {
      if (window.__autopageReady) return;
      const box = document.getElementById("scoreError");
      if (!box) return;
      box.textContent =
        "The app did not start. Serve this folder over http:// (not file://) " +
        "and make sure vendor/pdf.js was pulled — see the console for details.";
      box.hidden = false;
    }, 2500);
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
