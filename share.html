<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AutoPage — scan this</title>
  <link rel="icon" href="icon.svg" />
  <style>
    /* A card to hold up, show on a laptop, or print. Light on purpose: a QR
       on a dark screen scans worse, and this is the one page meant for paper. */
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #f4f5f7; color: #15171c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
    }
    .card {
      background: #fff; border-radius: 22px; padding: 36px 40px 30px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.10); text-align: center;
      max-width: 420px; width: 100%;
    }
    h1 { font-size: 30px; letter-spacing: -0.02em; margin: 0 0 4px; }
    .lede { color: #5d636e; margin: 0 0 26px; font-size: 15px; line-height: 1.45; }
    .qr { display: flex; justify-content: center; margin-bottom: 8px; min-height: 220px; }
    .qr svg { border-radius: 10px; }
    .url { font-size: 13px; color: #8a909b; word-break: break-all; margin: 0 0 26px; }

    /* The two steps nobody should have to be told out loud. */
    .steps { display: flex; align-items: stretch; gap: 10px; text-align: left; }
    .step {
      flex: 1; display: flex; gap: 10px; align-items: center;
      background: #f4f5f7; border-radius: 13px; padding: 12px 13px;
      font-size: 13px; line-height: 1.35;
    }
    .n {
      flex: 0 0 auto; width: 21px; height: 21px; border-radius: 50%;
      background: #15171c; color: #fff; font-size: 12px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .glyph { flex: 0 0 auto; color: #2f63f5; display: flex; }
    .note { margin: 18px 0 0; font-size: 12.5px; color: #8a909b; }

    @media print {
      body { background: #fff; padding: 0; }
      .card { box-shadow: none; max-width: none; }
      .note { display: none; }
    }
    @media (max-width: 440px) { .steps { flex-direction: column; } }
  </style>
</head>
<body>
  <main class="card">
    <h1>AutoPage</h1>
    <p class="lede">Turn the pages of a PDF score with your head.</p>

    <div class="qr" id="qr"></div>
    <p class="url" id="url"></p>

    <div class="steps">
      <div class="step">
        <span class="n">1</span>
        <span>Scan with the camera</span>
      </div>
      <div class="step">
        <span class="n">2</span>
        <span class="glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor"
               stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v12" /><path d="M8 7l4-4 4 4" />
            <path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6" />
          </svg>
        </span>
        <span>→ Add to Home Screen</span>
      </div>
    </div>

    <p class="note">Print this, or hold it up.</p>
  </main>

  <script type="module">
    // The code points at the app beside this page, so the card is right
    // wherever it is served from and there is no URL to keep in step by hand.
    import { qrSvg } from "./qr.js";
    const target = new URL("./", location.href).href;
    document.getElementById("qr").innerHTML = qrSvg(target, { size: 220, margin: 1 });
    document.getElementById("url").textContent = target.replace(/^https?:\/\//, "");

  </script>
</body>
</html>
